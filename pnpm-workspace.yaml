packages:
  - 'apps/*'
allowBuilds:
  esbuild: true
  sharp: false
  workerd: false
onlyBuiltDependencies:
  - esbuild
  - workerd
overrides:
  # Fix shared-memory serialization and resource-exhaustion advisories in 5.9.1.
  devalue: ^5.9.3
  # Keep the existing 5.x glob/lint dependency on its patched release.
  'brace-expansion@^5.0.0': ^5.0.12
  cookie: ^0.7.0
  # Dev/test-only (jsdom > undici); patches 7 Dependabot advisories. Not in the shipped bundle.
  # Pinned to the 7.x line jsdom 29 is tested against (avoid the undici 8 major bump).
  undici: ^7.30.0
