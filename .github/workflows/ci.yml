name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Android bundle and version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect Android and release changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(pnpm-lock.yaml|pnpm-workspace.yaml|apps/web-svelte/(android/|package.json|capacitor.config.ts|src/lib/content/changelog.json|scripts/android-)|scripts/(.*release.*|.*android-bundle.sh)|\.github/workflows/(ci|deploy-play-internal).yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-web
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-java@v5
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Build unsigned AAB and verify embedded version
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/web-svelte
        env:
          PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: placeholder
          PUBLIC_VAPID_KEY: placeholder
          PUBLIC_PLAUSIBLE_DOMAIN: ""
          PUBLIC_GOOGLE_WEB_CLIENT_ID: placeholder
        run: |
          node ../../scripts/check-release-version.mjs
          pnpm exec vite build --mode production
          pnpm exec cap sync android
          bash ../../scripts/build-android-bundle.sh

  quality:
    name: Typecheck, lint, format, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release version
        run: node scripts/check-release-version.mjs

      - name: Validate branch flow
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/check-branch-flow.sh "$BASE_REF" "$HEAD_REF"

      - uses: ./.github/actions/setup-web

      - name: Repository automation tests
        run: node --test scripts/android-release.test.mjs scripts/supabase-ops.test.mjs apps/web-svelte/scripts/seed-personas.test.mjs

      - name: Typecheck
        working-directory: apps/web-svelte
        run: |
          printf 'PUBLIC_SUPABASE_URL=https://placeholder.supabase.co\nPUBLIC_SUPABASE_ANON_KEY=placeholder\nPUBLIC_VAPID_KEY=placeholder\nPUBLIC_PLAUSIBLE_DOMAIN=\n' > .env
          pnpm exec svelte-kit sync
          pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: Lint
        working-directory: apps/web-svelte
        run: pnpm lint

      - name: Format check
        working-directory: apps/web-svelte
        run: pnpm format:check

      - name: Unit tests
        working-directory: apps/web-svelte
        run: pnpm test:unit

      - name: Component tests
        working-directory: apps/web-svelte
        run: pnpm test:components

      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --config .gitleaks.toml .

  rls:
    name: RLS regression
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect RLS-relevant changes
        id: rls-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Incomplete comparison history; running the full RLS job."
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/(actions/setup-web/|workflows/(ci|deploy-staging|deploy-production)\.yml$)|supabase/(migrations/|seed\.sql$|config\.toml$)|apps/web-svelte/tests/rls/|scripts/(check-security-advisors|load-local-env)\.sh$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No RLS-relevant changes; expensive database job skipped."
          fi

      - uses: ./.github/actions/setup-web
        if: steps.rls-scope.outputs.run == 'true'

      - uses: supabase/setup-cli@v3
        if: steps.rls-scope.outputs.run == 'true'
        with:
          version: 2.105.0

      - name: Start local Supabase stack
        if: steps.rls-scope.outputs.run == 'true'
        run: supabase start

      - name: Capture local Supabase env
        if: steps.rls-scope.outputs.run == 'true'
        run: |
          eval "$(supabase status -o env | sed -E 's/^([A-Z_]+)="?([^"]+)"?$/export \1=\2/')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Generate ephemeral RLS test password
        if: steps.rls-scope.outputs.run == 'true'
        run: echo "RLS_TEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Run RLS suite
        if: steps.rls-scope.outputs.run == 'true'
        working-directory: apps/web-svelte
        run: pnpm test:rls

      - name: Security advisors (fail on extensions in public)
        if: steps.rls-scope.outputs.run == 'true'
        run: bash scripts/check-security-advisors.sh

      - name: Stop local Supabase stack
        if: always() && steps.rls-scope.outputs.run == 'true'
        run: supabase stop --no-backup

  e2e:
    name: Playwright E2E mocked
    needs: [quality, rls]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect E2E-relevant changes
        id: e2e-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Incomplete comparison history; running the full E2E job."
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq '^(\.github/(actions/setup-web/|workflows/(ci|deploy-staging|deploy-production)\.yml$)|apps/web-svelte/(src/|e2e/|messages/|static/|package\.json$|playwright\.config\.ts$|vite\.config\.ts$|svelte\.config\.js$)|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No UI, route, copy, Playwright, or web dependency changes; E2E skipped."
          fi

      - uses: ./.github/actions/setup-web
        if: steps.e2e-scope.outputs.run == 'true'

      - name: Install Playwright browsers
        if: steps.e2e-scope.outputs.run == 'true'
        working-directory: apps/web-svelte
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app
        if: steps.e2e-scope.outputs.run == 'true'
        working-directory: apps/web-svelte
        env:
          PUBLIC_SUPABASE_URL: https://emqzcygfwcvbmhxhfkcc.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          PUBLIC_VAPID_KEY: BHKoiccZwq3Y5Qw5dmFxVLJIA7w9zcSZkchPKWk-vxBeR421yieZW7gGxuluBBa6sRmpIsFXRSuFyRarLcdvqT4
          PUBLIC_PLAUSIBLE_DOMAIN: ""
        run: pnpm build

      - name: Run Playwright tests
        if: steps.e2e-scope.outputs.run == 'true'
        working-directory: apps/web-svelte
        env:
          CI: true
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure() && steps.e2e-scope.outputs.run == 'true'
        with:
          name: playwright-report
          path: apps/web-svelte/playwright-report/
          retention-days: 7

  quality-matrix:
    name: Browser and accessibility matrix
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-web
      - name: Install browser matrix
        working-directory: apps/web-svelte
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build mocked app
        working-directory: apps/web-svelte
        env:
          PUBLIC_SUPABASE_URL: https://emqzcygfwcvbmhxhfkcc.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          PUBLIC_VAPID_KEY: ""
          PUBLIC_PLAUSIBLE_DOMAIN: ""
        run: pnpm build
      - name: Check layouts, accents and WCAG across engines
        working-directory: apps/web-svelte
        run: pnpm test:e2e:matrix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quality-matrix-results
          path: apps/web-svelte/test-results-matrix/
          retention-days: 7

  local-flows:
    name: Critical flows on isolated database
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-web
      - uses: supabase/setup-cli@v3
        with:
          version: 2.105.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Install Chromium
        working-directory: apps/web-svelte
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Test real UI and database mutations
        working-directory: apps/web-svelte
        run: pnpm test:e2e:local
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-flow-results
          path: apps/web-svelte/test-results-local/
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: supabase stop --no-backup
