name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  github-release:
    name: Tag and GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Publish the version named in package.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-github-release.sh
