name: Setup web workspace
description: Install pnpm, Node.js, and repository dependencies for the Svelte app.

runs:
  using: composite
  steps:
    - name: Configure bounded APT downloads
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # The Azure HTTP mirror can stall Playwright's install-deps on hosted runners.
        for mirrors in /etc/apt/apt-mirrors.txt /etc/apt/apt-security-mirrors.txt; do
          if [[ -f "$mirrors" ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$mirrors"
          fi
        done
        printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null

    - uses: pnpm/action-setup@v5
      with:
        version: 10

    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      env:
        # E2E job installs Chromium explicitly with --with-deps; skip postinstall download.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: pnpm install --frozen-lockfile
